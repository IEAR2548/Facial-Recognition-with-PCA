<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PCA Face Recognition Deployment</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}"
    />
  </head>
  <body>
    <div class="container">
      <h1>PCA Face Recognition</h1>
      <p>
        Upload Image
      </p>

      <!-- Form for file upload -->
      <form method="POST" action="/predict" enctype="multipart/form-data">
        <input type="file" name="file" accept="image/*" required />
        <button type="submit">submit</button>
      </form>

      <!-- Result Display Section -->
      {% if filename %}
      <div class="result-box">
        <h2>result:</h2>
        {% if prediction == 'UNKNOWN' %}
        <p style="color: red; font-size: 1.2em">UNKNOWN</p>
        {% else %}
        <p>
          person is:
          <strong style="color: #28a745; font-size: 1.3em"
            >{{ prediction }}</strong
          >
        </p>
        {% endif %}

        <img
          src="{{ url_for('static', filename='uploads/' + filename) }}"
          alt="Uploaded Face"
          class="result-image"
        />
        <p style="font-size: 0.8em; margin-top: 10px">
          (Image: {{ filename }})
        </p>
      </div>
      {% endif %} {% if error %}
      <div
        class="result-box"
        style="border-color: red; background-color: #ffcccc"
      >
        <h2>Error:</h2>
        <p>{{ error }}</p>
      </div>
      {% endif %}
    </div>
  </body>
</html>
